name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Stage APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/vtrail-terminal.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtrail-terminal-apk
          path: release-apk/vtrail-terminal.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.1
          name: "VTrail Terminal Android APK v1.2.1 (Standby on Startup & Active on StartBot)"
          body: |
            ## VTrail Binance Futures Terminal - Android APK v1.2.1 (Native Standalone)
            
            Versi ini berjalan **100% STANDALONE** langsung di HP Android tanpa perlu PC / remote server!
            
            ### Fitur & Pembaruan v1.2.1:
            - **Standby on App Launch**: Saat aplikasi dibuka, live price tick dan kalkulasi Confirmed S/R dalam kondisi SIAGA (STANDBY).
            - **Engage Bot Activation**: Live WebSocket tick stream, kalkulasi S/R presisi, dan trailing stop baru aktif setelah menekan tombol **ENGAGE BOT**.
            - **Clean Disengage**: Menekan tombol **DISENGAGE BOT** menghentikan streaming WebSocket, polling REST, dan mengembalikan terminal ke status STANDBY.
            - **Keep Screen Alive**: Layar tetap aktif saat terminal beroperasi.
            
            ### Cara Install:
            1. Download file **`vtrail-terminal.apk`** di bawah ini.
            2. Buka dan install di HP Android.
            3. Aplikasi langsung siap beroperasi mandiri di HP tanpa PC.
          draft: false
          prerelease: false
          files: release-apk/vtrail-terminal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
